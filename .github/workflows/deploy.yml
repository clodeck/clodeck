name: Deploy

# Production moves only like this: a PR from `main` merged into `master` (a merge
# commit), which fires this workflow. `workflow_dispatch` is the deliberate
# force-deploy: the same verify list, then the same deploy, without waiting for
# a new merge.
#
# Two jobs, in order. `verify` is the composite action CI runs, on `master`
# itself — the commit the server will deploy — so a green deploy cannot be a
# list that drifted from the one `main` passed. `deploy` only starts if it is
# green.
#
# `deploy` runs on the server's own self-hosted runner, labelled
# `clodeck-prod`: this host's provider filters inbound SSH from GitHub's
# runners, so the job reaches the machine by *being* on the machine, not by
# connecting to it. The verified SHA travels as an argument to the installed
# `/usr/local/bin/clodeck-deploy`, which stays root-owned and still accepts
# exactly `deploy <40-hex-sha>`.
#
# The server's rollback resets its own checkout to the previous commit; it does
# not rewrite GitHub's `master`. Reverting a bad publish on GitHub is a manual PR.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never cancel a deploy in progress: a half-applied release is worse than a
# queued one. A second trigger waits for the first to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      # The exact commit this job checked, handed to deploy so the server cannot
      # pull a newer `master` that nobody verified.
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          # On a push this is the pushed merge commit; on dispatch it is the tip
          # of production, which is still what the server will deploy.
          ref: master

      - name: Pin the commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify
        uses: ./.github/actions/verify

  deploy:
    name: deploy
    needs: verify
    # This label exists on one machine only: the clodeck server. Never add
    # `pull_request` to this workflow — the repository is public, and a fork's
    # PR would then run arbitrary code on that host.
    runs-on: [self-hosted, clodeck-prod]
    timeout-minutes: 20
    steps:
      - name: Check the deploy script
        run: test -x /usr/local/bin/clodeck-deploy

      - name: Deploy the verified commit
        env:
          VERIFIED_COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          if ! [[ "$VERIFIED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::verify did not report a full commit SHA ('$VERIFIED_COMMIT')."
            exit 1
          fi

          # The argument is data, not a command: the script accepts exactly
          # `deploy <sha>`, resets the checkout to that verified commit, builds,
          # restarts, waits for /healthz, and rolls back on failure.
          /usr/local/bin/clodeck-deploy deploy "$VERIFIED_COMMIT"
